version: "3"

tasks:
  check-deps:
    desc: "Vérifie les prérequis et leurs versions minimales"
    preconditions:
      - sh: "which ansible-playbook"
        msg: "ansible-playbook not found — install ansible-core >= 2.15"
      - sh: "which podman"
        msg: "podman not found — install podman >= 4.0"
      - sh: "which cargo"
        msg: "cargo not found — install Rust >= 1.75"
      - sh: "python3 scripts/check-versions.py"
        msg: "Version requirements not met (see output above)"

  build:
    desc: "Build all local mock images (podman build, 66 mocks in parallel)"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - ansible-playbook playbooks/00-build-mocks.yml

  test:
    desc: "Test one vulnerability (TP + TN) — task test ID=CVE-2021-41773"
    deps: [check-deps]
    dir: "{{.TASKFILE_DIR}}"
    requires:
      vars: [ID]
    cmds:
      - |
        set +e
        inv_dir=$(find inventories -mindepth 2 -maxdepth 2 -type d -name "{{.ID}}" | head -1)
        if [ -z "$inv_dir" ]; then
          echo "No inventory found for ID={{.ID}} (looked for inventories/*/{{.ID}})" >&2
          exit 1
        fi
        vendor=$(basename "$(dirname "$inv_dir")")
        playbook="playbooks/10-${vendor}-{{.ID}}.yml"
        ansible-playbook playbooks/00-build-noctis.yml playbooks/01-start-servers.yml
        startup_rc=$?
        if [ $startup_rc -eq 0 ]; then
          ansible-playbook "$playbook" -i "$inv_dir"
          test_rc=$?
        else
          test_rc=$startup_rc
        fi
        ansible-playbook playbooks/99-stop-servers.yml
        exit $test_rc

  test-all:
    desc: "Run all vulnerability tests — servers start once, each runs independently (failures don't stop the suite)"
    deps: [check-deps]
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - |
        set +e
        ansible-playbook playbooks/00-build-noctis.yml playbooks/01-start-servers.yml
        startup_rc=$?
        overall_rc=0
        if [ $startup_rc -eq 0 ]; then
          for inv_dir in $(find inventories -mindepth 2 -maxdepth 2 -type d | sort); do
            vendor=$(basename "$(dirname "$inv_dir")")
            id=$(basename "$inv_dir")
            playbook="playbooks/10-${vendor}-${id}.yml"
            if [ -f "$playbook" ]; then
              ansible-playbook "$playbook" -i "$inv_dir"
              [ $? -ne 0 ] && overall_rc=1
            fi
          done
        else
          overall_rc=$startup_rc
        fi
        ansible-playbook playbooks/99-stop-servers.yml
        exit $overall_rc

  mocks-manifest:
    desc: "Regenerate infra/docker/MOCKS.md from the current inventories"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - python3 ../scripts/gen_mocks_manifest.py

  feeds-check:
    desc: "Verify feed SHA lockfile + uid uniqueness — pass -- --write to regenerate the lockfile"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - python3 ../scripts/check_feeds.py {{.CLI_ARGS}}

  clean:
    desc: "Remove all local noctis/* images"
    cmds:
      - podman images --format '{{"{{"}}{{".Repository"}}{{"}}"}}:{{"{{"}}{{".Tag"}}{{"}}"}}' | grep '^noctis/' | xargs -r podman rmi --ignore || true
