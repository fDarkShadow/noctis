---
all:
  children:
    netgear_readynas_cmd_injection:
      hosts:
        netgear_readynas_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_netgear_readynas_vuln
          docker_image: "noctis/netgear-readynas-mock:vuln"
          expected_result: vulnerable
          expected_qod: 97
          expected_min_confidence: 0.90
        netgear_readynas_vuln_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_netgear_readynas_vuln_https
          docker_image: "noctis/netgear-readynas-mock:vuln"
          container_port: 443
          expected_result: vulnerable
          expected_qod: 97
          expected_min_confidence: 0.90
        netgear_readynas_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_netgear_readynas_patched
          docker_image: "noctis/netgear-readynas-mock:patched"
          expected_result: clean
        netgear_readynas_patched_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_netgear_readynas_patched_https
          docker_image: "noctis/netgear-readynas-mock:patched"
          container_port: 443
          expected_result: clean
