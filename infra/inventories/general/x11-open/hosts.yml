          expected_min_confidence: 0.75
        x11_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: x11
          container_name: noctis_x11_patched
          docker_image: "noctis/x11-mock:patched"
          container_port: 6000
