---
all:
  children:
    snmp_default_community:
      hosts:
        snmp_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: snmp
          container_name: noctis_snmp_default_community_vuln
          docker_image: "noctis/snmp-mock:vuln"
          container_port: 161
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80

        snmp_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: snmp
          container_name: noctis_snmp_default_community_patched
          docker_image: "noctis/snmp-mock:patched"
          container_port: 161
          expected_result: clean
