---
all:
  children:
    dns_open_resolver:
      hosts:
        dns_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: domain
          container_name: noctis_dns_open_resolver_vuln
          docker_image: "noctis/dns-mock:vuln"
          container_port: 53
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        dns_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: domain
          container_name: noctis_dns_open_resolver_patched
          docker_image: "noctis/dns-mock:patched"
          container_port: 53
          expected_result: clean
