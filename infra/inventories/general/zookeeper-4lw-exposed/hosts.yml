          expected_min_confidence: 0.70
        zk_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: zookeeper
          container_name: noctis_zk_4lw_patched
          docker_image: "noctis/zookeeper-mock:patched"
