---
all:
  children:
    ntp_monlist:
      hosts:
        ntp_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: ntp
          container_name: noctis_ntp_monlist_vuln
          docker_image: "noctis/ntp-mock:vuln"
          container_port: 123
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        ntp_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: ntp
          container_name: noctis_ntp_monlist_patched
          docker_image: "noctis/ntp-mock:patched"
          container_port: 123
          expected_result: clean
