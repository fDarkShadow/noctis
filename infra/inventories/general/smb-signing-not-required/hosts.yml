all:
  children:
    smb_signing_not_required:
      hosts:
        smb_signing_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: smb
          container_name: noctis_smb_signing_vuln
          docker_image: "noctis/smb-mock:vuln"
          container_port: 445
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.85
        smb_signing_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: smb
          container_name: noctis_smb_signing_patched
          docker_image: "noctis/smb-mock:patched"
          container_port: 445
          expected_result: clean
