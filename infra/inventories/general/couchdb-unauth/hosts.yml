---
all:
  children:
    couchdb_unauth:
      hosts:
        couch_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_couchdb_vuln
          docker_image: "noctis/couchdb-mock:vuln"
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        couch_vuln_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_couchdb_vuln_https
          docker_image: "noctis/couchdb-mock:vuln"
          container_port: 443
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        couch_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_couchdb_patched
          docker_image: "noctis/couchdb-mock:patched"
          expected_result: clean
        couch_patched_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_couchdb_patched_https
          docker_image: "noctis/couchdb-mock:patched"
          container_port: 443
          expected_result: clean
