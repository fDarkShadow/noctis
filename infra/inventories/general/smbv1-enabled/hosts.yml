---
all:
  children:
    smbv1_enabled:
      hosts:
        smb_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: smb
          container_name: noctis_smbv1_vuln
          docker_image: "noctis/smb-mock:vuln"
          container_port: 445
          expected_result: vulnerable
          expected_qod: 70
          expected_min_confidence: 0.75
        smb_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: smb
          container_name: noctis_smbv1_patched
          docker_image: "noctis/smb-mock:patched"
          container_port: 445
          expected_result: clean
