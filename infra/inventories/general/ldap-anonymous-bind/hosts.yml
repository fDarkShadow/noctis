---
all:
  children:
    ldap_anonymous_bind:
      hosts:
        ldap_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: ldap
          container_name: noctis_ldap_anon_vuln
          docker_image: "noctis/ldap-mock:vuln"
          container_port: 389
          expected_result: vulnerable
          expected_qod: 70
          expected_min_confidence: 0.70
        ldap_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: ldap
          container_name: noctis_ldap_anon_patched
          docker_image: "noctis/ldap-mock:patched"
          container_port: 389
          expected_result: clean
