---
all:
  children:
    ssh_default_credentials:
      hosts:
        ssh_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: ssh
          container_name: noctis_ssh_default_credentials_vuln
          docker_image: "noctis/ssh-mock:vuln"
          container_port: 22
          expected_result: vulnerable
          expected_qod: 97
          expected_min_confidence: 0.90

        ssh_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: ssh
          container_name: noctis_ssh_default_credentials_patched
          docker_image: "noctis/ssh-mock:patched"
          container_port: 22
          expected_result: clean
