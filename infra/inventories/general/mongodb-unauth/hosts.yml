---
all:
  children:
    mongodb_unauth:
      hosts:
        mongodb_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: mongodb
          container_name: noctis_mongodb_unauth_vuln
          docker_image: "noctis/mongodb-mock:vuln"
          container_port: 27017
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        mongodb_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: mongodb
          container_name: noctis_mongodb_unauth_patched
          docker_image: "noctis/mongodb-mock:patched"
          container_port: 27017
          expected_result: clean
