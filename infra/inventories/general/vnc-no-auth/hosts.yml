---
all:
  children:
    vnc_no_auth:
      hosts:
        vnc_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: vnc
          container_name: noctis_vnc_no_auth_vuln
          docker_image: "noctis/vnc-mock:vuln"
          container_port: 5900
          expected_result: vulnerable
          expected_qod: 70
          expected_min_confidence: 0.75
        vnc_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: vnc
          container_name: noctis_vnc_no_auth_patched
          docker_image: "noctis/vnc-mock:patched"
          container_port: 5900
          expected_result: clean
