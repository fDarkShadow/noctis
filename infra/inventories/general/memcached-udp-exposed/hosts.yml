---
all:
  children:
    memcached_udp_exposed:
      hosts:
        memcached_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: memcached
          container_name: noctis_memcached_udp_vuln
          docker_image: "noctis/memcached-mock:vuln"
          container_port: 11211
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80

        memcached_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: memcached
          container_name: noctis_memcached_udp_patched
          docker_image: "noctis/memcached-mock:patched"
          container_port: 11211
          expected_result: clean
