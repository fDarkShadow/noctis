---
all:
  children:
    smtp_open_relay:
      hosts:
        smtp_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: smtp
          container_name: noctis_smtp_open_relay_vuln
          docker_image: "noctis/smtp-mock:vuln"
          container_port: 25
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80

        smtp_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: smtp
          container_name: noctis_smtp_open_relay_patched
          docker_image: "noctis/smtp-mock:patched"
          container_port: 25
          expected_result: clean
