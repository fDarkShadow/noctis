---
all:
  children:
    prometheus_exposed:
      hosts:
        prom_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_prometheus_vuln
          docker_image: "noctis/prometheus-mock:vuln"
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.70
        prom_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_prometheus_patched
          docker_image: "noctis/prometheus-mock:patched"
          expected_result: clean
