---
all:
  children:
    elasticsearch_unauth:
      hosts:
        elasticsearch_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_elasticsearch_unauth_vuln
          docker_image: "noctis/elasticsearch-mock:vuln"
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80

        elasticsearch_vuln_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_elasticsearch_unauth_vuln_https
          docker_image: "noctis/elasticsearch-mock:vuln"
          container_port: 443
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80

        elasticsearch_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_elasticsearch_unauth_patched
          docker_image: "noctis/elasticsearch-mock:patched"
          expected_result: clean

        elasticsearch_patched_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_elasticsearch_unauth_patched_https
          docker_image: "noctis/elasticsearch-mock:patched"
          container_port: 443
          expected_result: clean
