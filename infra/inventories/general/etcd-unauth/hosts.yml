---
all:
  children:
    etcd_unauth:
      hosts:
        etcd_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_etcd_vuln
          docker_image: "noctis/etcd-mock:vuln"
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        etcd_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_etcd_patched
          docker_image: "noctis/etcd-mock:patched"
          expected_result: clean
