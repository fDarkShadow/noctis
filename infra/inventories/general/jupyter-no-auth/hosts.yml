          container_name: noctis_jupyter_vuln
          docker_image: "noctis/jupyter-mock:vuln"
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        jup_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_jupyter_patched
          docker_image: "noctis/jupyter-mock:patched"
          expected_result: clean
