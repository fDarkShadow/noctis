---
all:
  children:
    ftp_anonymous:
      hosts:
        ftp_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: ftp
          container_name: noctis_ftp_anonymous_vuln
          docker_image: "noctis/ftp-mock:vuln"
          container_port: 21
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80

        ftp_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: ftp
          container_name: noctis_ftp_anonymous_patched
          docker_image: "noctis/ftp-mock:patched"
          container_port: 21
          expected_result: clean
