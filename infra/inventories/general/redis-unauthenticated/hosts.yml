---
all:
  children:
    redis_unauthenticated:
      hosts:
        redis_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: redis
          container_name: noctis_redis_unauth_vuln
          docker_image: "noctis/redis-mock:vuln"
          container_port: 6379
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        redis_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: redis
          container_name: noctis_redis_unauth_patched
          docker_image: "noctis/redis-mock:patched"
          container_port: 6379
          expected_result: clean
