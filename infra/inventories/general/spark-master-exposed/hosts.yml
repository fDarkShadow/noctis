---
all:
  children:
    spark_master_exposed:
      hosts:
        spark_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_spark_vuln
          docker_image: "noctis/spark-mock:vuln"
          expected_result: vulnerable
          expected_qod: 70
          expected_min_confidence: 0.75
        spark_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_spark_patched
          docker_image: "noctis/spark-mock:patched"
          expected_result: clean
