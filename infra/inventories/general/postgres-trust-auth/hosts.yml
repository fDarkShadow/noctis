---
all:
  children:
    postgres_trust_auth:
      hosts:
        pg_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: postgresql
          container_name: noctis_postgres_trust_vuln
          docker_image: "noctis/postgres-mock:vuln"
          container_port: 5432
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        pg_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: postgresql
          container_name: noctis_postgres_trust_patched
          docker_image: "noctis/postgres-mock:patched"
          container_port: 5432
          expected_result: clean
