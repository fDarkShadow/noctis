---
all:
  children:
    memcached_tcp_exposed:
      hosts:
        mc_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: memcached
          container_name: noctis_memcached_tcp_vuln
          docker_image: "noctis/memcached-tcp-mock:vuln"
          container_port: 11211
          expected_result: vulnerable
          expected_qod: 70
          expected_min_confidence: 0.75
        mc_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: memcached
          container_name: noctis_memcached_tcp_patched
          docker_image: "noctis/memcached-tcp-mock:patched"
          container_port: 11211
          expected_result: clean
