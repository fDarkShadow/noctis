---
all:
  children:
    quantum_scalar_lfi:
      hosts:
        quantum_scalar_lfi_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_quantum_scalar_lfi_vuln
          docker_image: "noctis/quantum-mock:vuln"
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        quantum_scalar_lfi_vuln_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_quantum_scalar_lfi_vuln_https
          docker_image: "noctis/quantum-mock:vuln"
          container_port: 443
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        quantum_scalar_lfi_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_quantum_scalar_lfi_patched
          docker_image: "noctis/quantum-mock:patched"
          expected_result: clean
        quantum_scalar_lfi_patched_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_quantum_scalar_lfi_patched_https
          docker_image: "noctis/quantum-mock:patched"
          container_port: 443
          expected_result: clean
