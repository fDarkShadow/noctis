---
all:
  children:
    clipbucket_multiple_vulns:
      hosts:
        clipbucket_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_clipbucket_vuln
          docker_image: "noctis/clipbucket-mock:vuln"
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        clipbucket_vuln_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_clipbucket_vuln_https
          docker_image: "noctis/clipbucket-mock:vuln"
          container_port: 443
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        clipbucket_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_clipbucket_patched
          docker_image: "noctis/clipbucket-mock:patched"
          expected_result: clean
        clipbucket_patched_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_clipbucket_patched_https
          docker_image: "noctis/clipbucket-mock:patched"
          container_port: 443
          expected_result: clean
