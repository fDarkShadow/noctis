---
all:
  children:
    splunk_multiple_vuln:
      hosts:
        splunk_mv_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_splunk_mv_vuln
          docker_image: "noctis/splunk-mock:vuln"
          expected_result: vulnerable
          expected_qod: 97
          expected_min_confidence: 0.90
        splunk_mv_vuln_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_splunk_mv_vuln_https
          docker_image: "noctis/splunk-mock:vuln"
          container_port: 443
          expected_result: vulnerable
          expected_qod: 97
          expected_min_confidence: 0.90
        splunk_mv_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_splunk_mv_patched
          docker_image: "noctis/splunk-mock:patched"
          expected_result: clean
        splunk_mv_patched_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_splunk_mv_patched_https
          docker_image: "noctis/splunk-mock:patched"
          container_port: 443
          expected_result: clean
