---
all:
  children:
    cups_webui_xss:
      hosts:
        cups_xss_vuln:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_cups_xss_vuln
          docker_image: "noctis/cups-mock:vuln"
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        cups_xss_vuln_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_cups_xss_vuln_https
          docker_image: "noctis/cups-mock:vuln"
          container_port: 443
          expected_result: vulnerable
          expected_qod: 75
          expected_min_confidence: 0.80
        cups_xss_patched:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: http
          container_name: noctis_cups_xss_patched
          docker_image: "noctis/cups-mock:patched"
          expected_result: clean
        cups_xss_patched_https:
          ansible_host: localhost
          ansible_connection: local
          target_host: "127.0.0.1"
          target_service: https
          container_name: noctis_cups_xss_patched_https
          docker_image: "noctis/cups-mock:patched"
          container_port: 443
          expected_result: clean
