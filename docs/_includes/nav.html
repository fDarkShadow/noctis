{%- assign doc_pages = site.pages | where: "layout", "doc" | where_exp: "p", "p.nav_order" | sort: "nav_order" -%}
<a class="skip" href="#content">Skip to content</a>
<header class="nav{% if page.layout == 'doc' %} has-tabs{% endif %}">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="noctis home">
      <svg width="26" height="26" viewBox="0 0 92 92" aria-hidden="true">
        <defs>
          <linearGradient id="ng" x1="8" y1="8" x2="84" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
          <mask id="nm"><rect width="92" height="92" fill="#000"/><circle cx="46" cy="46" r="40" fill="#fff"/><circle cx="63" cy="33" r="35" fill="#000"/></mask>
        </defs>
        <circle cx="46" cy="46" r="40" fill="url(#ng)" mask="url(#nm)"/>
      </svg>
      noctis
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="{{ '/getting-started.html' | relative_url }}"{% if page.layout == 'doc' %} class="current" aria-current="true"{% endif %}>Docs</a>
      <a class="hide-sm" href="https://buymeacoffee.com/fdarkshadow">Sponsor</a>
      <div class="hsearch" role="search">
        <button type="button" class="hsearch-toggle" aria-label="Search the docs" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <div class="hsearch-box">
          <label class="sr-only" for="doc-search">Search the documentation</label>
          <input id="doc-search" type="search" placeholder="Search docs…" autocomplete="off">
          <div id="search-results" class="search-results" hidden></div>
        </div>
      </div>
      <a class="pill" href="https://github.com/fDarkShadow/noctis">★ GitHub</a>
    </nav>
  </div>
  {%- if page.layout == 'doc' %}
  <nav class="tabs" aria-label="Documentation">
    <div class="wrap">
      {%- for p in doc_pages %}
      <a href="{{ p.url | relative_url }}"{% if p.url == page.url %} aria-current="page"{% endif %}>{{ p.title }}</a>
      {%- endfor %}
    </div>
  </nav>
  <script>(function(){var w=document.querySelector('.tabs .wrap'),a=w&&w.querySelector('[aria-current]');if(a&&w.scrollWidth>w.clientWidth)w.scrollLeft=a.offsetLeft-(w.clientWidth-a.offsetWidth)/2;})();</script>
  {%- endif %}
  <script type="application/json" id="doc-index">[{% for p in doc_pages %}{"title": {{ p.title | jsonify }}, "url": {{ p.url | relative_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
</header>
