title: noctis
description: >-
  A Rust black-box vulnerability scanner driven by self-contained YAML feeds —
  evidence-graded CVE and misconfiguration detection for live services.

# Project Pages are served from a subpath.
url: https://fdarkshadow.github.io
baseurl: /noctis

# No external theme: the site ships its own layouts (_layouts/landing.html for the
# home page, _layouts/doc.html for every docs page) and one stylesheet.
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-seo-tag

# Every page is a docs page unless its front matter says otherwise.
defaults:
  - scope:
      path: ""
    values:
      layout: doc

# GitHub Pages serves this folder (Settings → Pages → Source: main /docs).
