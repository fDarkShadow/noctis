name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per PR: a new push to a PR branch cancels that PR's run still in
# progress. Pushes to main are never cancelled (each one may publish :edge).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssh2-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssh2-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache-audit.outputs.cache-hit != 'true'
      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - run: cargo audit

  feeds:
    name: Validate YAML feeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache ys binary
        id: cache-ys
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/ys
          key: ys-${{ runner.os }}-0.9.1

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache-ys.outputs.cache-hit != 'true'

      - name: Install yaml-schema (ys)
        if: steps.cache-ys.outputs.cache-hit != 'true'
        run: cargo install yaml-schema --locked

      - name: Validate feeds
        run: |
          for f in tests/vulnerabilities/*/*.yaml; do
            ys -f schemas/feed.schema.json "$f"
          done

      - name: Feed integrity (sha lockfile + uid uniqueness)
        run: python3 scripts/check_feeds.py

      - name: Mock manifest up to date
        run: python3 scripts/gen_mocks_manifest.py --check

      - name: Docs in sync with engine
        run: python3 scripts/check_docs.py

  bake:
    name: Validate bake files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every docker-bake HCL file
        working-directory: infra/bake
        run: |
          # Parsing each bake file catches malformed HCL (e.g. a dropped
          # closing brace) that the Image build — which only runs on push to
          # main — would otherwise be the first to hit. `--print` evaluates the
          # whole file without building; addressing the first target forces a
          # full parse (any syntax error anywhere fails it).
          status=0
          for f in *.hcl; do
            first=$(grep -m1 '^target "' "$f" | sed -E 's/^target "([^"]+)".*/\1/')
            if [ -z "$first" ]; then
              echo "::warning file=infra/bake/$f::no target block found, skipping"
              continue
            fi
            echo "::group::$f (target $first)"
            if docker buildx bake -f "$f" --print "$first" >/dev/null; then
              echo "ok: $f"
            else
              echo "::error file=infra/bake/$f::docker buildx bake failed to parse $f (malformed HCL?)"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
          output: sarif-results
          upload: always
      - name: Annotate and fail on CodeQL findings
        run: |
          sarif=sarif-results/rust.sarif
          # Emit one ::error annotation per finding — shows inline in PR diff
          jq -r '
            .runs[].results[] |
            "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // "unknown"),line=\(.locations[0].physicalLocation.region.startLine // 1),title=\(.ruleId // "CodeQL")::\(.message.text | gsub("\n";" "))"
          ' "$sarif" 2>/dev/null || true
          count=$(jq '[.runs[].results[]] | length' "$sarif")
          echo "CodeQL: $count finding(s)"
          [ "$count" -eq 0 ] || exit 1

  # Multi-arch `:edge` image (native amd64 + arm64) on every push to main —
  # same pipeline and per-arch caches as the release (docker-image.yml).
  docker:
    name: Image (edge)
    needs: [lint, test, audit, feeds, bake]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: type=raw,value=edge
