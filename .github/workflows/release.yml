name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Fail fast (before the expensive builds) if the tag and Cargo.toml disagree,
  # so a release can never ship a version that doesn't match the crate.
  version-check:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag == Cargo.toml version
        run: |
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml = $cargo_version | tag = $GITHUB_REF_NAME"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version — bump Cargo.toml or retag."
            exit 1
          fi

  # Multi-arch image (native amd64 + arm64 in parallel), published as X.Y.Z,
  # X.Y and latest. Same pipeline as `:edge` (docker-image.yml).
  image:
    needs: [version-check]
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest

  release:
    name: Publish GitHub Release
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git-cliff needs full history + tags for the changelog

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}

  # The docs site (docs/, Jekyll) is published only on release. A GitHub
  # Release created with GITHUB_TOKEN does not trigger other workflows, so the
  # Pages deploy is called from here rather than on `release: published`.
  pages:
    needs: [release]
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
