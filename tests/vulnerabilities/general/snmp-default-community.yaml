# Detect SNMP agents reachable with a default community string (public/private).
#
# GET sysDescr.0 trying the default communities. Any response means a default
# community is accepted, exposing system info without authentication.
uid: b22f27e9-a943-45d8-95b1-7b8be0f0258c
name: "SNMP default community string"
description: |
  The SNMP agent answers a GET with a default community string (public or
  private), exposing device/system information to unauthenticated clients.
cves: []
category: exposure
severity: medium
confidence_base: 0.50
tags: [snmp, default-credentials, exposure, misconfig]
services: [snmp]
author: noctis
version: "1.0.0"
references:
  - "https://cwe.mitre.org/data/definitions/1392.html"

steps:
  - id: snmp-get
    action: snmp_get
    port: "{{port}}"
    communities: ["public", "private"]
    oids: ["1.3.6.1.2.1.1.1.0"]
    timeout_secs: 5
    store_as: snmp

  - id: check-default-community
    action: match
    source: snmp.community
    pattern: "^(public|private)$"
    condition: "snmp.responded == true"
    on_match:
      finding:
        title: "SNMP default community string accepted"
        description: "The SNMP agent responded to a GET using a default community string."
        remediation: "Change the community string to a non-default value or disable SNMP v1/v2c."
        confidence_delta: 0.35
        qod: 75
        evidence: "community={{snmp.community}} sysDescr={{snmp.varbinds}}"
