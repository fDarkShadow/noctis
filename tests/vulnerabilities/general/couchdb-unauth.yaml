# Flag an Apache CouchDB in "admin party" mode (no authentication).
# When no admin is configured, every request is served with admin rights.
# GET /_all_dbs then returns the database list (including the system DBs
# _users/_replicator); a secured node returns 401 unauthorized.
uid: 4c9a2e67-1b38-4d05-a9f2-7e3c6b84d012
name: "CouchDB exposed without authentication (admin party)"
description: |
  The CouchDB server returned the database list to an unauthenticated request,
  confirming "admin party" mode — anyone can read/write all databases.
cves: []
category: exposure
severity: critical
confidence_base: 0.50
tags: [couchdb, unauthenticated, exposure, data-leak, misconfig]
services: [http, https]
author: noctis
version: "1.0.0"
references:
  - "https://docs.couchdb.org/en/stable/intro/security.html#the-admin-party"
steps:
  - id: couch-alldbs
    action: http_request
    method: GET
    path: "/_all_dbs"
    port: "{{port}}"
    tls_insecure: true
    follow_redirects: false
    timeout_secs: 10
    store_as: cdb
  - id: check-alldbs
    action: match
    source: cdb.body
    pattern: "_replicator"
    condition: "cdb.status == 200"
    on_match:
      finding:
        title: "CouchDB exposed without authentication (admin party)"
        description: "GET /_all_dbs returned the database list without credentials — CouchDB is in admin party mode."
        remediation: "Create a server admin (end the admin party), require authentication, bind to localhost, and firewall port 5984."
        confidence_delta: 0.35
        qod: 75
        evidence: "GET /_all_dbs (HTTP {{cdb.status}}): {{cdb.body}}"
