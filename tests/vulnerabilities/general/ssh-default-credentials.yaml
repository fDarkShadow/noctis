# Detect SSH servers accepting default / weak credentials.
#
# Tries a short explicit list of well-known default credentials; on success runs
# `id` and confirms command execution from its output. The credential list is
# explicit (no generated brute-force).
uid: 12f21e37-8f31-4e27-9ab7-93186a3dd006
name: "SSH default/weak credentials"
description: |
  The SSH server accepts a well-known default credential (e.g. root:toor), giving
  command execution. Confirmed by running `id` over the authenticated session.
cves: []
category: default-credentials
severity: high
confidence_base: 0.40
tags: [ssh, default-credentials, weak-auth, rce]
services: [ssh]
author: noctis
version: "1.0.0"
references:
  - "https://cwe.mitre.org/data/definitions/1392.html"

steps:
  - id: ssh-login
    action: ssh_exec
    port: "{{port}}"
    timeout_secs: 10
    credentials:
      - "root:toor"
      - "root:root"
      - "admin:admin"
    command: "id"
    store_as: ssh

  - id: check-default-cred
    action: match
    source: ssh.exec_output
    pattern: "uid=\\d+.*gid=\\d+"
    condition: "ssh.authenticated == true"
    on_match:
      finding:
        title: "SSH default/weak credentials"
        description: "The server accepted a default credential and executed `id`, confirming command execution."
        remediation: "Remove default accounts / set strong credentials and disable password auth where possible."
        confidence_delta: 0.55
        qod: 97
        evidence: "authenticated as {{ssh.auth_user}} — id: {{ssh.exec_output}}"
