[package]
name = "noctis"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "noctis"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# CLI
clap = { version = "4.6.10", features = ["derive"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
indexmap = { version = "2.14.2", features = ["serde"] }

# HTTP client
reqwest = { version = "0.13.5", features = ["json", "rustls", "stream"], default-features = false }

# TLS inspection
rustls = { version = "0.23.46", features = ["ring"] }
rustls-pki-types = "1.16.0"
x509-parser = "0.18.1"
tokio-rustls = "0.26.6"
webpki-roots = "1.0.12"

# SSH
ssh2 = "0.9.7"

# Scripting / expressions
rhai = { version = "1.27.0", features = ["sync"] }

# OOB server
axum = "0.8.9"
tower = "0.5.3"

# Pattern matching
regex = "1.13.2"

# Error handling
thiserror = "2.0.21"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Utils
jiff = { version = "1.0", default-features = false, features = ["std", "serde"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
glob = "0.3.4"
tokio-util = { version = "0.7.20", features = ["io"] }

# Validation
validator = { version = "0.21.0", features = ["derive"] }

# Protocols, encoding, hashing
csnmp = "0.6.0"
pnet = "0.35.0"
base64 = "0.23"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
