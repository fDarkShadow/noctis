[changelog]
header = "# Changelog\n\nAll notable changes to noctis are documented here.\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  # First match wins. A commit whose *subject line* names an advisory is a
  # security fix whatever its type (e.g. `chore(deps): fix RUSTSEC-…`).
  # `message` also sees the body, hence the single-line anchor.
  { message = "^[^\\n]*(RUSTSEC-[0-9]{4}-[0-9]+|GHSA-[0-9a-z]{4}-)", group = "Security" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^ci", group = "CI/CD" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Tests" },
  # Dependency updates matter to users of a security tool; other chores don't.
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", skip = true },
  { body = ".*security", group = "Security" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
